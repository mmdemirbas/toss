#:schema ../ajans/schema/project-2.schema.json
contract = 2

[verbs]
deploy = "Publish toss"

# HTTPS with a self-signed certificate, on every interface: toss is for sharing
# across a LAN, by design. / is the embedded web UI, a static file.
[operations.dev]
summary = "Run the server from source on https://localhost:7753 (all interfaces, for the LAN)"
lifecycle = "service"
port = 7753
tls = true
health = { path = "/" }

[operations.build]
summary = "Build bin/toss for this machine"

[operations."build dist"]
summary = "Cross-compile for macOS arm64/amd64, Windows and Linux into bin/"

[operations.test]
summary = "Go tests"

[operations.check]
summary = "Gate: manifest, tests with race and coverage, golangci-lint"

[operations.vendor]
summary = "Re-download the vendored highlight.js, marked and DOMPurify"
needs = ["network"]

[operations.clean]
summary = "Remove bin/"

[operations."deploy release"]
summary = "Gate, then tag and push the next version (major|minor|patch or vX.Y.Z); the release workflow publishes it"
target = "github:release"
effects = ["publishes"]
